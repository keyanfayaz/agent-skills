name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the skill version
        run: |
          version=$(sed -n 's/^  version: "\(.*\)"$/\1/p' skills/help-me-ai/SKILL.md)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match SKILL.md version $version" >&2
            exit 1
          fi

      - name: Build help-me-ai.zip
        run: scripts/build-zip.sh dist

      - name: Attach it to the release
        run: gh release upload "$GITHUB_REF_NAME" dist/help-me-ai.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
